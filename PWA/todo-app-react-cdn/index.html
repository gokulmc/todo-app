<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App (React CDN)</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4a2988" />

  <!-- Step 1: Load React from CDN — no npm or node_modules needed -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Step 2: Load Babel — lets us write JSX directly in the browser -->
  <!-- In a Vite app, Babel runs at build time. Here it runs live in the browser. -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #4a2988, #764ba2);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      background: #fff;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    h1 {
      font-size: 28px;
      color: #333;
      margin-bottom: 24px;
      text-align: center;
      letter-spacing: 1px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .input-row input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-row input:focus { border-color: #667eea; }

    .input-row button {
      padding: 12px 20px;
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .input-row button:hover { background: #5a6fd6; }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .filter-btn {
      flex: 1;
      padding: 8px;
      border: 2px solid #e0e0e0;
      background: transparent;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      color: #666;
      transition: all 0.2s;
    }

    .filter-btn.active, .filter-btn:hover {
      border-color: #667eea;
      color: #667eea;
      background: #f0f2ff;
    }

    #taskList {
      list-style: none;
      padding: 0;
      margin: 0;
      min-height: 40px;
      max-height: 320px;
      overflow-y: auto;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 8px;
      border-bottom: 1px solid #f0f0f0;
      animation: slideIn 0.2s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .task-item:last-child { border-bottom: none; }

    .task-item input[type='checkbox'] {
      width: 18px;
      height: 18px;
      accent-color: #667eea;
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-text {
      flex: 1;
      font-size: 15px;
      color: #333;
      word-break: break-word;
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: #aaa;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #ccc;
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
      transition: color 0.2s;
    }

    .delete-btn:hover { color: #e53935; }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #f0f0f0;
    }

    #itemCount { font-size: 13px; color: #999; }

    #clearDoneBtn {
      background: none;
      border: none;
      color: #999;
      font-size: 13px;
      cursor: pointer;
      transition: color 0.2s;
    }

    #clearDoneBtn:hover { color: #e53935; }
  </style>
</head>
<body>

  <!-- Step 3: This is the only HTML element React needs — it mounts the app here -->
  <div id="root"></div>

  <!-- Step 4: type="text/babel" tells Babel to transform this script before running it -->
  <!-- Without this, the browser wouldn't understand JSX syntax -->
  <script type="text/babel">

    // React and ReactDOM are available as globals because we loaded them via CDN above
    const { useState } = React;

    // A single task row
    function TaskItem({ task, onToggle, onDelete }) {
      return (
        <li className={`task-item ${task.done ? 'done' : ''}`}>
          <input
            type="checkbox"
            checked={task.done}
            onChange={() => onToggle(task.id)}
          />
          <span className="task-text">{task.text}</span>
          <button className="delete-btn" onClick={() => onDelete(task.id)}>✕</button>
        </li>
      );
    }

    // The filter button bar
    function Filters({ current, onChange }) {
      const filters = ['all', 'active', 'done'];
      return (
        <div className="filters">
          {filters.map(f => (
            <button
              key={f}
              className={`filter-btn ${current === f ? 'active' : ''}`}
              onClick={() => onChange(f)}
            >
              {f.charAt(0).toUpperCase() + f.slice(1)}
            </button>
          ))}
        </div>
      );
    }

    // Root component — owns all state
    function App() {
      const [tasks, setTasks]   = useState([]);
      const [input, setInput]   = useState('');
      const [filter, setFilter] = useState('all');

      function addTask() {
        const text = input.trim();
        console.log('addTask — trimmed:', JSON.stringify(text));
        if (!text) { console.warn('Empty input, doing nothing'); return; }
        const newTask = { id: Date.now(), text, done: false };
        setTasks(prev => { const u = [...prev, newTask]; console.log('tasks now:', u); return u; });
        setInput('');
      }

      function toggleTask(id) {
        console.log('toggleTask — id:', id);
        setTasks(prev => prev.map(t => t.id === id ? { ...t, done: !t.done } : t));
      }

      function deleteTask(id) {
        console.log('deleteTask — id:', id);
        setTasks(prev => { const u = prev.filter(t => t.id !== id); console.log('tasks now:', u); return u; });
      }

      function clearDone() {
        setTasks(prev => { const u = prev.filter(t => !t.done); console.log('cleared, remaining:', u); return u; });
      }

      const visible = tasks.filter(t => {
        if (filter === 'active') return !t.done;
        if (filter === 'done')   return t.done;
        return true;
      });

      const remaining = tasks.filter(t => !t.done).length;

      return (
        <div className="container">
          <h1>My Tasks</h1>

          <div className="input-row">
            <input
              type="text"
              placeholder="Add a new task..."
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && addTask()}
            />
            <button onClick={addTask}>Add</button>
          </div>

          <Filters current={filter} onChange={f => { console.log('filter:', f); setFilter(f); }} />

          <ul id="taskList">
            {visible.map(task => (
              <TaskItem
                key={task.id}
                task={task}
                onToggle={toggleTask}
                onDelete={deleteTask}
              />
            ))}
          </ul>

          <div className="footer">
            <span id="itemCount">{remaining} item{remaining !== 1 ? 's' : ''} left</span>
            <button id="clearDoneBtn" onClick={clearDone}>Clear Done</button>
          </div>
        </div>
      );
    }

    // Step 5: Mount the App component into the #root div
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.error('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
