<!DOCTYPE html> <!-- Tells the browser this is an HTML5 document -->
<html lang="en"> <!-- Root element of the page; lang="en" sets the language to English -->
<head> <!-- Contains metadata about the page (not visible to the user) -->
  <meta charset="UTF-8" /> <!-- Allows the page to display all characters (letters, symbols, emoji) correctly -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- Makes the page scale correctly on mobile devices -->
  <title>Todo App</title> <!-- Sets the text shown on the browser tab -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4a2988" />

  <!-- Bootstrap CSS: loads the full Bootstrap component library from a CDN (no install needed) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

  <!-- Our custom overrides that sit on top of Bootstrap -->
  <link rel="stylesheet" href="style_bootstrap.css" />
</head>
<body> <!-- Everything inside here is visible on the page -->

  <!-- todo-wrapper: full-height flex container that centres the card on the page -->
  <div class="todo-wrapper">

    <!-- todo-card: Bootstrap card component — white box with rounded corners -->
    <div class="card todo-card rounded-4 p-4">

      <!-- Card heading -->
      <h1 class="text-center mb-4 fs-3 fw-semibold text-dark">My Tasks</h1>

      <!-- input-group: Bootstrap component that attaches the input and button edge-to-edge -->
      <div class="input-group mb-3">
        <input
          type="text"
          id="taskInput"
          class="form-control"
          placeholder="Add a new task..."
        /> <!-- form-control: Bootstrap styles the input with padding, border, and focus ring -->
        <button id="addBtn1" class="btn btn-primary">Add</button> <!-- btn btn-primary: Bootstrap's filled blue button (we override colour to purple in our CSS) -->
      </div>

      <!-- btn-group: Bootstrap groups the three filter buttons into a single connected bar -->
      <div class="btn-group w-100 mb-3" role="group">
        <button class="btn btn-outline-secondary filter-btn active" data-filter="all">All</button>
        <button class="btn btn-outline-secondary filter-btn" data-filter="active">Active</button>
        <button class="btn btn-outline-secondary filter-btn" data-filter="done">Done</button>
        <!-- btn-outline-secondary: Bootstrap's outlined button style (border only, no fill by default) -->
      </div>

      <!-- list-group: Bootstrap component for a bordered, stacked list of items -->
      <ul id="taskList" class="list-group list-group-flush mb-3"></ul>
      <!-- list-group-flush: removes the outer border so it blends into the card -->

      <!-- Footer row: space-between layout using Bootstrap flex utilities -->
      <div class="d-flex justify-content-between align-items-center pt-2 border-top">
        <span id="itemCount" class="text-muted small">0 items left</span> <!-- text-muted small: Bootstrap grey small text -->
        <button id="clearDoneBtn" class="btn btn-link btn-sm text-muted p-0">Clear Done</button> <!-- btn-link: Bootstrap makes this look like a plain text link, not a box button -->
      </div>

    </div> <!-- End of .todo-card -->
  </div> <!-- End of .todo-wrapper -->

  <!-- Bootstrap JS bundle: required for interactive Bootstrap components (included for completeness) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Our app logic — loaded last so the DOM is fully ready -->
  <script src="app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.error('SW registration failed:', err));
      });
    }
  </script>
</body> <!-- End of visible page content -->
</html> <!-- End of the HTML document -->
